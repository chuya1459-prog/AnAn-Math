<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安安的數學冒險</title>

<style>
body{
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#eaf4ff;
  text-align:center;
  padding:30px;
}

.card{
  max-width:600px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:25px;
}

button{
  font-size:22px;
  padding:15px 25px;
  border:0;
  border-radius:15px;
  background:#d8ecff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>🏎️ 安安的數學冒險</h1>

<p>準備好開始冒險了嗎？</p>

<button onclick="startGame()">
🚦 開始冒險
</button>

<div id="game"></div>

</div>

<script>

function startGame(){

  document.getElementById("game").innerHTML =
  "<h2>🎉 成功！</h2>" +
  "<p>安安的數學冒險開始了！</p>" +
  "<p>🏎️ 賽車已經出發！</p>";

}

</script>

</body>
</html>
