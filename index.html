<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安安的數學冒險</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #eaf4ff;
  color: #17324d;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.center {
  text-align: center;
}

.hidden {
  display: none;
}

h1 {
  font-size: 36px;
  margin: 10px 0;
}

h2 {
  font-size: 27px;
}

.subtitle {
  color: #667788;
}

button {
  border: none;
  border-radius: 15px;
  padding: 14px 22px;
  margin: 6px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: #d8ecff;
  color: #17324d;
}

.main-button {
  font-size: 22px;
  padding: 16px 30px;
}

.track {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 8px;
  margin: 20px 0;
}

.track-box {
  height: 50px;
  border: 2px solid #b9c9d8;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 23px;
}

.track-box.active {
  background: #d9efff;
}

.question {
  text-align: center;
  font-size: 55px;
  font-weight: bold;
  margin: 25px 0;
}

.answers {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.answers button {
  min-height: 65px;
  background: white;
  border: 2px solid #c7d5e2;
  font-size: 25px;
}

.feedback {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  min-height: 35px;
  margin: 15px;
}

.cars {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}

.car-card {
  border: 2px solid #d7e1ea;
  border-radius: 18px;
  padding: 12px;
  text-align: center;
}

.car-card.locked {
  opacity: .4;
}

.car-card svg {
  width: 100%;
  height: 120px;
}

.print-area {
  background: white;
  text-align: center;
}

.print-area svg {
  width: 100%;
  max-width: 650px;
}

@media(max-width:500px) {
  h1 {
    font-size: 29px;
  }

  .question {
    font-size: 43px;
  }

  .answers {
    grid-template-columns: 1fr 1fr;
  }

  .cars {
    grid-template-columns: 1fr;
  }
}

@media print {
  body {
    background: white;
  }

  .no-print {
    display: none !important;
  }

  .print-area {
    display: block !important;
    box-shadow: none;
  }

  .print-area svg {
    max-height: 70vh;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- 首頁 -->
<section id="home" class="card center">

<div style="font-size:70px;">🏁</div>

<h1>🏎️ 安安的數學冒險</h1>

<p class="subtitle">
算數學、跑賽車、解鎖六台賽車！
</p>

<p>
⭐ 每關 5 題<br>
🏎️ 答對一題，前進一格<br>
🎨 完成一關，解鎖一台賽車
</p>

<button class="main-button" onclick="startLevel(1)">
🚦 開始冒險
</button>

<br>

<button onclick="openGarage()">
🏎️ 我的車庫
</button>

</section>


<!-- 答題頁 -->
<section id="quiz" class="card hidden">

<h2 id="levelTitle"></h2>

<div class="center" id="questionNumber"></div>

<div class="track" id="track"></div>

<div id="question" class="question"></div>

<div id="answers" class="answers"></div>

<div id="feedback" class="feedback"></div>

</section>


<!-- 過關頁 -->
<section id="levelComplete" class="card center hidden">

<div style="font-size:65px;">🏆</div>

<h2 id="completeTitle"></h2>

<p id="completeText"></p>

<div id="completeCar"></div>

<button class="main-button" onclick="printColoring(currentCar)">
🎨 列印這台賽車
</button>

<br>

<button onclick="openGarage()">
🏎️ 我的車庫
</button>

<br>

<button id="nextLevelButton"></button>

</section>


<!-- 車庫 -->
<section id="garage" class="card hidden">

<h2 class="center">🏎️ 安安的賽車車庫</h2>

<p id="unlockText" class="center subtitle"></p>

<div id="carList" class="cars"></div>

<div class="center">

<button onclick="goHome()">
🏠 回首頁
</button>

<button onclick="continueGame()">
🚦 繼續闖關
</button>

</div>

</section>


<!-- 進階關卡 -->
<section id="advanced" class="card hidden">

<h2 class="center">
🏆 進階賽道
</h2>

<p class="center subtitle">
二位數＋一位數<br>
二位數－一位數
</p>

<div id="advancedQuestion" class="question"></div>

<div id="advancedAnswers" class="answers"></div>

<div id="advancedFeedback" class="feedback"></div>

</section>


<!-- 著色圖 -->
<section id="printPage" class="card print-area hidden">

<h2 id="printTitle"></h2>

<p>
姓名：____________________　
日期：________________
</p>

<div id="printCar"></div>

<h3>
🎨 幫這台賽車塗上你喜歡的顏色！
</h3>

<div class="no-print">

<button onclick="window.print()">
🖨️ 列印 A4
</button>

<button onclick="openGarage()">
↩️ 回到車庫
</button>

</div>

</section>

</div>


<script>

/* =========================
   遊戲資料
========================= */

const cars = [
  "閃電一號",
  "火箭跑車",
  "超級賽車",
  "雷霆戰車",
  "彩虹跑車",
  "冠軍賽車"
];

let unlocked = 0;
let currentLevel = 1;
let currentQuestion = 0;
let progress = 0;
let currentCar = 0;


/* =========================
   畫面切換
========================= */

function showPage(id) {

  const pages = [
    "home",
    "quiz",
    "levelComplete",
    "garage",
    "advanced",
    "printPage"
  ];

  pages.forEach(page => {
    document.getElementById(page)
      .classList.toggle("hidden", page !== id);
  });

  window.scrollTo(0,0);
}


/* =========================
   首頁
========================= */

function goHome() {
  showPage("home");
}


/* =========================
   隨機排序
========================= */

function shuffle(array) {

  for(let i=array.length-1;i>0;i--) {

    const j =
      Math.floor(Math.random()*(i+1));

    [array[i],array[j]] =
      [array[j],array[i]];
  }

  return array;
}


/* =========================
   產生題目
========================= */

function createQuestion() {

  const addition =
    Math.random() < 0.5;

  let a;
  let b;

  if(addition) {

    a = Math.floor(Math.random()*9)+1;

    b =
      Math.floor(Math.random()*(10-a));

    return {
      text: `${a} ＋ ${b} ＝？`,
      answer: a+b
    };

  } else {

    a =
      Math.floor(Math.random()*9)+2;

    b =
      Math.floor(Math.random()*(a-1))+1;

    return {
      text: `${a} － ${b} ＝？`,
      answer: a-b
    };
  }
}


/* =========================
   開始關卡
========================= */

function startLevel(level) {

  currentLevel = level;

  currentQuestion = 0;

  progress = 0;

  showPage("quiz");

  renderQuestion();
}


/* =========================
   顯示題目
========================= */

function renderQuestion() {

  const q = createQuestion();

  document.getElementById("levelTitle")
    .textContent =
    `🏁 第 ${currentLevel} 關`;

  document.getElementById("questionNumber")
    .textContent =
    `第 ${currentQuestion+1} 題／共 5 題`;

  document.getElementById("question")
    .textContent = q.text;

  document.getElementById("feedback")
    .textContent = "";

  drawTrack();

  let answers =
    new Set();

  answers.add(q.answer);

  while(answers.size < 3) {

    const wrong =
      Math.max(
        0,
        q.answer +
        Math.floor(Math.random()*5)-2
      );

    answers.add(wrong);
  }

  answers =
    shuffle([...answers]);

  document.getElementById("answers")
    .innerHTML =
    answers.map(
      answer =>
      `<button onclick="checkAnswer(${answer},${q.answer})">
        ${answer}
      </button>`
    ).join("");
}


/* =========================
   賽車跑道
========================= */

function drawTrack() {

  let html = "";

  for(let i=0;i<5;i++) {

    let content = "";

    if(i < progress) {

      content = "✓";

    } else if(i === progress) {

      content = "🏎️";

    } else {

      content = i+1;
    }

    html +=
      `<div class="track-box ${
        i < progress ? "active" : ""
      }">
        ${content}
      </div>`;
  }

  document.getElementById("track")
    .innerHTML = html;
}


/* =========================
   答題
========================= */

function checkAnswer(
  selected,
  correct
) {

  const buttons =
    document.querySelectorAll(
      "#answers button"
    );

  buttons.forEach(
    button => button.disabled = true
  );

  if(selected === correct) {

    progress++;

    document.getElementById("feedback")
      .textContent =
      "🎉 答對了！賽車前進一格！";

    drawTrack();

    setTimeout(() => {

      currentQuestion++;

      if(currentQuestion >= 5) {

        completeLevel();

      } else {

        renderQuestion();
      }

    },700);

  } else {

    document.getElementById("feedback")
      .textContent =
      "💪 再想一下，再試一次！";

    setTimeout(() => {

      renderQuestion();

    },900);
  }
}


/* =========================
   關卡完成
========================= */

function completeLevel() {

  unlocked =
    Math.max(
      unlocked,
      currentLevel
    );

  currentCar =
    currentLevel-1;

  document.getElementById("completeTitle")
    .textContent =
    `🎉 第 ${currentLevel} 關完成！`;

  document.getElementById("completeText")
    .textContent =
    `安安解鎖了「${cars[currentCar]}」！`;

  document.getElementById("completeCar")
    .innerHTML =
    carSVG(currentCar,true);

  const next =
    document.getElementById(
      "nextLevelButton"
    );

  if(currentLevel < 6) {

    next.textContent =
      `🏁 挑戰第 ${currentLevel+1} 關`;

    next.onclick =
      () => startLevel(
        currentLevel+1
      );

  } else {

    next.textContent =
      "🚀 進入進階賽道";

    next.onclick =
      startAdvanced;
  }

  showPage("levelComplete");

  renderGarage();
}


/* =========================
   車庫
========================= */

function openGarage() {

  renderGarage();

  showPage("garage");
}


function renderGarage() {

  document.getElementById("unlockText")
    .textContent =
    `已解鎖 ${unlocked} / 6 台賽車`;

  let html = "";

  cars.forEach((car,index) => {

    const isUnlocked =
      index < unlocked;

    html += `
      <div class="car-card ${
        isUnlocked ? "" : "locked"
      }">

        <h3>
          🏎️ ${car}
        </h3>

        ${carSVG(index,false)}

        ${
          isUnlocked

          ?

          `<button
             onclick="printColoring(${index})">
             🎨 列印著色圖
           </button>`

          :

          `<p>
             🔒 完成第 ${index+1} 關解鎖
           </p>`
        }

      </div>
    `;
  });

  document.getElementById("carList")
    .innerHTML = html;
}


function continueGame() {

  if(unlocked < 6) {

    startLevel(unlocked+1);

  } else {

    startAdvanced();
  }
}


/* =========================
   賽車線稿
========================= */

  const stroke =
    lineArt ? "#111" : "#2563eb";

  const fill =
    lineArt ? "white" : "#dbeafe";

      stroke-width="5"/>

    <path
      d="M105 58 L140 44 L183 54 L178 78 L92 78Z"
      fill="white"
      stroke="${stroke}"
      stroke-width="4"/>

    `
    <path
      d="M40 90 L90 52 L195 50 L270 90"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="5"/>

    <path
      d="M118 55 L151 31 L181 53"
      fill="white"
      stroke="${stroke}"
      stroke-width="4"/>
    `,

    `
    <path
      d="M38 90 L82 62 L125 52 L220 58 L270 90"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="5"/>

    <path
      d="M102 61 L139 42 L188 56 L180 78 L94 78Z"
      fill="white"
      stroke="${stroke}"
      stroke-width="4"/>

    <path
      d="M222 59 L258 43 L269 64"
      fill="none"
      stroke="${stroke}"
      stroke-width="6"/>
    `,

    `
    <path
      d="M42 90 L82 53 L207 49 L268 90"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="5
